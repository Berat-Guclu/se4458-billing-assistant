_format_version: "3.0"
_transform: true

services:
  - name: billing-api
    url: http://billing-api:8000
    routes:
      - name: health
        paths:
          - /health
        methods:
          - GET
        strip_path: false
      - name: openapi
        paths:
          - /openapi.json
          - /docs
          - /redoc
        strip_path: false
      - name: auth-login
        paths:
          - "~/api/v1/auth(/|$)"
        strip_path: false
        regex_priority: 10
      - name: bill-detailed
        paths:
          - "~/api/v1/bills/detailed$"
        methods:
          - GET
        strip_path: false
        regex_priority: 30
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
      - name: bill-pay
        paths:
          - "~/api/v1/bills/pay$"
        methods:
          - POST
        strip_path: false
        regex_priority: 30
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
      - name: bill-calculate
        paths:
          - "~/api/v1/bills/calculate$"
        methods:
          - POST
        strip_path: false
        regex_priority: 30
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
      - name: query-bill
        paths:
          - "~/api/v1/bills$"
        methods:
          - GET
        strip_path: false
        regex_priority: 5
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false
      - name: add-usage
        paths:
          - "~/api/v1/usage$"
        methods:
          - POST
        strip_path: false
        regex_priority: 20
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

consumers:
  - username: billing-api-tokens
    jwt_secrets:
      - key: billing-key
        algorithm: HS256
        secret: billing-demo-secret-key-please-change
