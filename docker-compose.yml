name: billing-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "5433:5432"

  billing-api:
    build: ./billing-api
    environment:
      DATABASE_URL: postgresql+psycopg://billing:billing@postgres:5432/billing
      JWT_SECRET: billing-demo-secret-key-please-change
      JWT_ISSUER: billing-key
      SEED_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: info
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    depends_on:
      billing-api:
        condition: service_healthy
    ports:
      - "8088:8000"
      - "8001:8001"

  mcp-server:
    build: ./mcp-server
    environment:
      BILLING_GUIDE_PATH: /app/docs/Mobile_Provider_Billing_Guide.md
    ports:
      - "8002:8000"

  agent:
    build: ./agent
    environment:
      GATEWAY_BASE_URL: http://kong:8000
      MCP_URL: http://mcp-server:8000/mcp
      JWT_SECRET: billing-demo-secret-key-please-change
      JWT_ISSUER: billing-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - kong
      - mcp-server
    ports:
      - "8080:8080"

volumes:
  pgdata:
